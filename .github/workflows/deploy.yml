name: Deploy

on:
  push:
    branches:
      - main

env:
  # Pozor: jméno repozitáře je "LSD-trip.cz", ale ghcr.io přijímá jen malá
  # písmena - proto tady nejde použít ${{ github.repository }} a image je
  # zapsaný natvrdo v malých písmenech.
  IMAGE: ghcr.io/janfrancik/lsd-trip.cz:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,IMAGE
          script: |
            set -e
            cd /home/deploy/apps/lsdtrip
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker compose exec -T app npm run migrate
            docker image prune -f
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
