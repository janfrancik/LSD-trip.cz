services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/janfrancik/lsd-trip.cz:latest
    container_name: lsdtrip-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
    networks:
      - internal
      - web
    depends_on:
      db:
        condition: service_healthy
    # Žádné "ports:" - kontejner není publikovaný na hostitele,
    # Caddy k němu přistupuje přes síť "web" (reverse_proxy lsdtrip-app:3000)

networks:
  web:
    external: true
  internal:

volumes:
  db_data:
